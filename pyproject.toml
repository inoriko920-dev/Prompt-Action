[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-action"
version = "0.1.0.dev0"
description = "Prompt Action desktop application foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "PySide6==6.11.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_action = ["ui/qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests/step01"]
pythonpath = ["src"]
addopts = "-ra"
