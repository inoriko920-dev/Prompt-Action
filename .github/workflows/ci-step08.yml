name: STEP 08 Settings CI

on:
  push:
    branches:
      - 'sol/step08-*'
  pull_request:
    paths:
      - 'src/prompt_action/settings/**'
      - 'src/prompt_action/ui/viewmodels/**'
      - 'src/prompt_action/main.py'
      - 'src/prompt_action/ui/qml/pages/SettingsPage.qml'
      - 'src/prompt_action/ui/qml/settings/**'
      - 'src/prompt_action/ui/qml/shell/**'
      - 'tests/step08/**'
      - 'scripts/dev/*step08*'
      - '.github/workflows/ci-step08.yml'
      - 'docs/implementation/STEP_08_SOL_EXECUTION_REPORT.md'
      - 'docs/evidence/step08/**'

jobs:
  validate-step08:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software
      QSG_RENDER_LOOP: basic
      QT_QUICK_CONTROLS_STYLE: Basic
      STEP08_DPI: '100;125;150;175'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Verify exact Python
        run: python -c "import platform,sys; print(sys.version); assert sys.version_info[:3] == (3,13,16); assert platform.architecture()[0] == '64bit'"
      - name: Install exact lock
        run: python -m pip install -r requirements-lock.txt
      - name: Install Prompt Action editable
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Verify STEP 08 prerequisites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-step08-evidence | Out-Null
          python scripts/dev/verify_step08_preflight.py | Tee-Object -FilePath ci-step08-evidence/preflight.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture STEP 08 visual/state evidence
        run: python scripts/dev/capture_step08_evidence.py --output ci-step08-evidence
      - name: STEP 08 T01-T50
        run: python -m pytest tests/step08 -q
      - name: DPI 100/125/150/175 smoke
        shell: pwsh
        run: |
          $map = @{ "100"="1.0"; "125"="1.25"; "150"="1.5"; "175"="1.75" }
          foreach ($dpi in $env:STEP08_DPI.Split(';')) {
            $env:QT_SCALE_FACTOR = $map[$dpi]
            Write-Host "STEP 08 DPI smoke: $dpi% factor=$env:QT_SCALE_FACTOR"
            python -m prompt_action --smoke-test-ms 100
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
      - name: Regenerate STEP 03 evidence for regression
        run: python scripts/dev/capture_step03_evidence.py --output ci-step03-regression-evidence
      - name: Regenerate STEP 04 evidence for regression
        run: python scripts/dev/capture_step04_evidence.py --output ci-step04-regression-evidence
      - name: Regenerate STEP 05 evidence for regression
        run: python scripts/dev/capture_step05_evidence.py --output ci-step05-regression-evidence
      - name: Regenerate STEP 06 evidence for regression
        run: python scripts/dev/capture_step06_evidence.py --output ci-step06-regression-evidence
      - name: Regenerate STEP 07 evidence for regression
        run: python scripts/dev/capture_step07_evidence.py --output ci-step07-regression-evidence
      - name: STEP 01-07 regression
        env:
          STEP03_EVIDENCE_DIR: ${{ github.workspace }}\ci-step03-regression-evidence
          STEP04_EVIDENCE_DIR: ${{ github.workspace }}\ci-step04-regression-evidence
        run: python -m pytest tests/step01 tests/step02 tests/step03 tests/step04 tests/step05 tests/step06 tests/step07 -q
      - name: Module settings smoke
        run: python -m prompt_action --smoke-test-ms 180
      - name: Verify protected hashes again
        run: python scripts/dev/verify_step08_preflight.py
      - name: Upload STEP 08 evidence
        uses: actions/upload-artifact@v4
        with:
          name: step08-settings-evidence
          path: ci-step08-evidence
          retention-days: 30
