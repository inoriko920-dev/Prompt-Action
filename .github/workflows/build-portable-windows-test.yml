name: Windows Portable Test Build

on:
  push:
    branches:
      - 'sol/windows-portable-*'
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software
      QSG_RENDER_LOOP: basic
      QT_QUICK_CONTROLS_STYLE: Basic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
          architecture: x64

      - name: Verify exact Python
        shell: pwsh
        run: |
          python -c "import platform,sys; assert sys.version_info[:3] == (3,13,16); assert platform.architecture()[0] == '64bit'"

      - name: Install application lock
        run: python -m pip install -r requirements-lock.txt

      - name: Install portable build lock
        run: python -m pip install -r requirements-build-lock.txt

      - name: Install Prompt Action editable
        run: python -m pip install -e . --no-deps --no-build-isolation

      - name: Verify source application before freezing
        run: python -m prompt_action --smoke-test-ms 300

      - name: Build portable Windows ZIP
        shell: pwsh
        run: ./scripts/build_portable_windows.ps1 -BuildLabel "${{ github.sha }}"

      - name: Verify portable layout
        shell: pwsh
        run: |
          $root = "portable-output\Prompt-Action-Portable-Test"
          $required = @(
            "$root\PromptAction.exe",
            "$root\_internal",
            "$root\pyproject.toml",
            "$root\data\version_history.json",
            "$root\prompts",
            "$root\backups",
            "$root\src\prompt_action\ui\qml\App.qml",
            "$root\BACA_DULU.txt",
            "$root\BUILD_INFO.txt",
            "$root\Jalankan Prompt Action.bat",
            "$root\Cek Portable.bat",
            "$root\Buat Paket Diagnostik.bat",
            "$root\scripts\portable_launch.ps1",
            "$root\scripts\portable_self_check.ps1",
            "$root\scripts\portable_collect_diagnostics.ps1",
            "$root\runtime\diagnostics"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing portable path: $path" }
          }

      - name: Verify Windows EXE metadata
        shell: pwsh
        run: |
          $exe = "portable-output\Prompt-Action-Portable-Test\PromptAction.exe"
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne "Prompt Action") { throw "Unexpected ProductName: $($info.ProductName)" }
          if ($info.FileDescription -ne "Prompt Action desktop application") { throw "Unexpected FileDescription: $($info.FileDescription)" }
          if ($info.OriginalFilename -ne "PromptAction.exe") { throw "Unexpected OriginalFilename: $($info.OriginalFilename)" }
          if ($info.ProductVersion -ne "0.1.0.dev0") { throw "Unexpected ProductVersion: $($info.ProductVersion)" }
          if ($info.FileVersion -ne "0.1.0.0") { throw "Unexpected FileVersion: $($info.FileVersion)" }
          Write-Host "PRODUCT_NAME=$($info.ProductName)"
          Write-Host "PRODUCT_VERSION=$($info.ProductVersion)"
          Write-Host "FILE_VERSION=$($info.FileVersion)"

      - name: Verify portable user-facing text
        shell: pwsh
        run: |
          $root = "portable-output\Prompt-Action-Portable-Test"
          $readme = Get-Content "$root\BACA_DULU.txt" -Raw
          $buildInfo = Get-Content "$root\BUILD_INFO.txt" -Raw
          foreach ($text in @($readme, $buildInfo)) {
            if ($text -match '[\x00-\x08\x0B\x0C\x0E-\x1F]') {
              throw "Portable user-facing text contains unexpected control characters"
            }
          }
          foreach ($requiredText in @("Jalankan Prompt Action.bat", "portable-launch-status.txt", "Cek Portable.bat", "Buat Paket Diagnostik.bat", "runtime\diagnostics", "portable-self-check.txt", "PromptAction.exe", "_internal", "backups", "0.1.0.dev0", "Prompt Action v22.5.2")) {
            if (-not $readme.Contains($requiredText) -and -not $buildInfo.Contains($requiredText)) {
              throw "Portable metadata text missing required value: $requiredText"
            }
          }

      - name: Run packaged portable self-check
        shell: pwsh
        run: |
          $root = (Resolve-Path "portable-output\Prompt-Action-Portable-Test").Path
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root\scripts\portable_self_check.ps1" -Root $root -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw "Portable self-check failed with exit code $LASTEXITCODE" }
          $report = "$root\runtime\logs\portable-self-check.txt"
          if (-not (Test-Path $report)) { throw "Portable self-check report missing" }
          $text = Get-Content $report -Raw
          if (-not $text.Contains("RESULT: PASS")) { throw "Portable self-check did not report PASS" }
          foreach ($requiredText in @("ProductName: Prompt Action", "ProductVersion: 0.1.0.dev0", "Smoke test exit code: 0")) {
            if (-not $text.Contains($requiredText)) { throw "Self-check report missing: $requiredText" }
          }

      - name: Verify crash-aware portable launcher
        shell: pwsh
        run: |
          $root = (Resolve-Path "portable-output\Prompt-Action-Portable-Test").Path
          $launcher = "$root\scripts\portable_launch.ps1"
          $statusPath = "$root\runtime\logs\portable-launch-status.txt"

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -Root $root -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw "Crash-aware launcher smoke path failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $statusPath)) { throw "Portable launch status report missing" }
          $status = Get-Content $statusPath -Raw
          foreach ($text in @("Mode: SMOKE_TEST", "RESULT: PASS", "ExitCode: 0")) {
            if (-not $status.Contains($text)) { throw "Launcher PASS report missing: $text" }
          }

          $exe = "$root\PromptAction.exe"
          $hidden = "$root\PromptAction.exe.launch-test-hidden"
          Move-Item $exe $hidden -Force
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -Root $root -SmokeTest
            $failureCode = $LASTEXITCODE
            if ($failureCode -eq 0) { throw "Launcher missing-EXE path unexpectedly returned success" }
            $failureStatus = Get-Content $statusPath -Raw
            if (-not $failureStatus.Contains("RESULT: FAIL")) { throw "Launcher missing-EXE path did not report FAIL" }
            if (-not $failureStatus.Contains("PromptAction.exe is missing")) { throw "Launcher missing-EXE reason missing" }
            $selfCheckFailure = Get-Content "$root\runtime\logs\portable-self-check.txt" -Raw
            if (-not $selfCheckFailure.Contains("RESULT: FAIL")) { throw "Automatic self-check did not record FAIL for missing EXE" }
          } finally {
            Move-Item $hidden $exe -Force
          }

      - name: Verify privacy-safe diagnostic bundle
        shell: pwsh
        run: |
          $root = (Resolve-Path "portable-output\Prompt-Action-Portable-Test").Path
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root\scripts\portable_collect_diagnostics.ps1" -Root $root
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic bundle collector failed with exit code $LASTEXITCODE" }

          $diagDir = "$root\runtime\diagnostics"
          $zip = Get-ChildItem $diagDir -Filter "Prompt-Action-Diagnostic-*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { throw "Diagnostic ZIP missing" }
          $sidecar = "$($zip.FullName).sha256"
          if (-not (Test-Path $sidecar)) { throw "Diagnostic ZIP SHA256 sidecar missing" }
          $actual = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLowerInvariant()
          $expected = ((Get-Content $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) { throw "Diagnostic ZIP SHA256 mismatch" }

          $extract = Join-Path $env:RUNNER_TEMP "prompt-action-diagnostic-check"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force

          $requiredLeaf = @("SUMMARY.txt", "BUILD_INFO.txt", "portable-launch-status.txt", "portable-self-check.txt", "EXE_INFO.txt", "LOG_INDEX.txt", "STRUCTURE.txt")
          $files = Get-ChildItem $extract -File -Recurse
          foreach ($leaf in $requiredLeaf) {
            if (-not ($files | Where-Object { $_.Name -eq $leaf })) { throw "Diagnostic bundle missing $leaf" }
          }

          $forbidden = @("version_history.json", "settings.json", "Prompt-3_V1_R1.txt", "B001.zip")
          foreach ($name in $forbidden) {
            if ($files | Where-Object { $_.Name -eq $name }) { throw "Diagnostic bundle leaked forbidden file: $name" }
          }

          $summary = Get-Content (($files | Where-Object { $_.Name -eq "SUMMARY.txt" } | Select-Object -First 1).FullName) -Raw
          foreach ($text in @("Prompt file contents are NOT included", "Backup archive contents are NOT included", "Arbitrary application log contents are NOT included", "Absolute portable/user paths are redacted")) {
            if (-not $summary.Contains($text)) { throw "Diagnostic privacy declaration missing: $text" }
          }

          foreach ($leaf in @("portable-launch-status.txt", "portable-self-check.txt")) {
            $sanitizedText = Get-Content (($files | Where-Object { $_.Name -eq $leaf } | Select-Object -First 1).FullName) -Raw
            if ($sanitizedText.Contains($root)) { throw "Diagnostic $leaf leaked portable root path" }
            if ($env:USERPROFILE -and $sanitizedText.Contains($env:USERPROFILE)) { throw "Diagnostic $leaf leaked USERPROFILE" }
          }

          $sanitizedLauncher = Get-Content (($files | Where-Object { $_.Name -eq "portable-launch-status.txt" } | Select-Object -First 1).FullName) -Raw
          if (-not $sanitizedLauncher.Contains("RESULT: FAIL")) { throw "Diagnostic launcher status missing captured failure evidence" }

          $sanitizedSelfCheck = Get-Content (($files | Where-Object { $_.Name -eq "portable-self-check.txt" } | Select-Object -First 1).FullName) -Raw
          if (-not $sanitizedSelfCheck.Contains("<PORTABLE_ROOT>")) { throw "Diagnostic self-check did not redact portable root" }

          $logIndex = Get-Content (($files | Where-Object { $_.Name -eq "LOG_INDEX.txt" } | Select-Object -First 1).FullName) -Raw
          if ($logIndex.Contains("portable-self-check.txt")) { throw "Diagnostic log index leaked original log filename" }
          if (-not $logIndex.Contains("ORIGINAL FILENAMES NOT INCLUDED")) { throw "Diagnostic log index missing filename-redaction declaration" }

      - name: Smoke test frozen EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path "portable-output\Prompt-Action-Portable-Test\PromptAction.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test-ms", "800" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Host "Frozen EXE exit code: $($process.ExitCode)"
            Get-ChildItem "portable-output\Prompt-Action-Portable-Test\runtime\logs" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "LOG: $($_.FullName)"
              if (-not $_.PSIsContainer) { Get-Content $_.FullName -ErrorAction SilentlyContinue }
            }
            exit $process.ExitCode
          }

      - name: Verify ZIP checksum
        shell: pwsh
        run: |
          $zip = "portable-output\Prompt-Action-Portable-Test-Windows-x64.zip"
          $sidecar = "$zip.sha256"
          if (-not (Test-Path $zip) -or -not (Test-Path $sidecar)) { throw "ZIP or SHA256 sidecar missing" }
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = ((Get-Content $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) { throw "Portable ZIP SHA256 mismatch" }
          Write-Host "ZIP_SHA256=$actual"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Action-Portable-Test-Windows-x64
          path: |
            portable-output/Prompt-Action-Portable-Test-Windows-x64.zip
            portable-output/Prompt-Action-Portable-Test-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
