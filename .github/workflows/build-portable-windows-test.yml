name: Windows Portable Test Build

on:
  push:
    branches:
      - 'sol/windows-portable-test-build-*'
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QSG_RHI_BACKEND: software
      QSG_RENDER_LOOP: basic
      QT_QUICK_CONTROLS_STYLE: Basic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
          architecture: x64

      - name: Verify exact Python
        shell: pwsh
        run: |
          python -c "import platform,sys; assert sys.version_info[:3] == (3,13,16); assert platform.architecture()[0] == '64bit'"

      - name: Install application lock
        run: python -m pip install -r requirements-lock.txt

      - name: Install portable build lock
        run: python -m pip install -r requirements-build-lock.txt

      - name: Install Prompt Action editable
        run: python -m pip install -e . --no-deps --no-build-isolation

      - name: Verify source application before freezing
        run: python -m prompt_action --smoke-test-ms 300

      - name: Build portable Windows ZIP
        shell: pwsh
        run: ./scripts/build_portable_windows.ps1 -BuildLabel "${{ github.sha }}"

      - name: Verify portable layout
        shell: pwsh
        run: |
          $root = "portable-output\Prompt-Action-Portable-Test"
          $required = @(
            "$root\PromptAction.exe",
            "$root\_internal",
            "$root\pyproject.toml",
            "$root\data\version_history.json",
            "$root\prompts",
            "$root\backups",
            "$root\src\prompt_action\ui\qml\App.qml",
            "$root\BACA_DULU.txt",
            "$root\Jalankan Prompt Action.bat"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing portable path: $path" }
          }

      - name: Smoke test frozen EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path "portable-output\Prompt-Action-Portable-Test\PromptAction.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test-ms", "800" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Host "Frozen EXE exit code: $($process.ExitCode)"
            Get-ChildItem "portable-output\Prompt-Action-Portable-Test\runtime\logs" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "LOG: $($_.FullName)"
              if (-not $_.PSIsContainer) { Get-Content $_.FullName -ErrorAction SilentlyContinue }
            }
            exit $process.ExitCode
          }

      - name: Verify ZIP checksum
        shell: pwsh
        run: |
          $zip = "portable-output\Prompt-Action-Portable-Test-Windows-x64.zip"
          $sidecar = "$zip.sha256"
          if (-not (Test-Path $zip) -or -not (Test-Path $sidecar)) { throw "ZIP or SHA256 sidecar missing" }
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = ((Get-Content $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) { throw "Portable ZIP SHA256 mismatch" }
          Write-Host "ZIP_SHA256=$actual"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Action-Portable-Test-Windows-x64
          path: |
            portable-output/Prompt-Action-Portable-Test-Windows-x64.zip
            portable-output/Prompt-Action-Portable-Test-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
