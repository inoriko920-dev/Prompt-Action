name: STEP 03 Design System UI Shell CI

on:
  push:
    branches:
      - 'sol/step03-*'
  pull_request:
    paths:
      - '.github/workflows/ci-step03.yml'
      - 'scripts/dev/verify_step03_inputs.py'
      - 'scripts/dev/capture_step03_evidence.py'
      - 'src/prompt_action/ui/**'
      - 'tests/step03/**'
      - 'evidence/step03/**'
      - 'docs/implementation/STEP_03_SOL_EXECUTION_REPORT.md'

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software
  QSG_RHI_BACKEND: software
  QSG_RENDER_LOOP: basic
  QT_QUICK_CONTROLS_STYLE: Basic

jobs:
  validate-step03:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
          architecture: 'x64'
          check-latest: false
      - name: Verify exact Python
        run: python -c "import platform,sys; print(sys.version); assert sys.version_info[:3] == (3,13,16); assert platform.architecture()[0] == '64bit'"
      - name: Install exact lock
        run: python -m pip install -r requirements-lock.txt
      - name: Install Prompt Action editable
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Verify STEP 03 prerequisite inputs
        run: python scripts/dev/verify_step03_inputs.py --output ci-step03-evidence/input-gate
      - name: Capture visual evidence
        run: python scripts/dev/capture_step03_evidence.py --output ci-step03-evidence
      - name: STEP 03 T01-T30
        env:
          STEP03_EVIDENCE_DIR: ${{ github.workspace }}\ci-step03-evidence
        run: python -m pytest tests/step03 -q
      - name: STEP 01-02 regression
        run: python -m pytest tests/step01 tests/step02 -q
      - name: Module shell smoke
        run: python -m prompt_action --smoke-test-ms 150
      - name: Upload STEP 03 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: step03-visual-evidence
          path: ci-step03-evidence
          retention-days: 30
