name: TEMP STEP 09.5 Source Probe

on:
  push:
    branches:
      - 'sol/step09-5-tree-build-temp'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode preserved recovery chunks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force probe | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($name in @('zz_BOOTSTRAP','zz_REBUILD')) {
            $parts = Get-ChildItem "$name/chunks/*.b64" | Sort-Object Name
            $stream = [IO.MemoryStream]::new()
            try {
              foreach ($part in $parts) {
                $text = Get-Content $part.FullName -Raw
                $text = $text -replace '[^A-Za-z0-9+/=]', ''
                $chunk = [Convert]::FromBase64String($text)
                $stream.Write($chunk, 0, $chunk.Length)
                Write-Host "PART=$($part.Name) DECODED=$($chunk.Length)"
              }
              $bytes = $stream.ToArray()
            } finally {
              $stream.Dispose()
            }
            $out = "probe/$name.zip"
            [IO.File]::WriteAllBytes($out, $bytes)
            $sha = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "SOURCE=$name SIZE=$($bytes.Length) SHA256=$sha"
            try {
              $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $out))
              Write-Host "ENTRIES=$($zip.Entries.Count)"
              $zip.Entries | Select-Object -First 100 | ForEach-Object { Write-Host "ENTRY=$($_.FullName) SIZE=$($_.Length)" }
              $zip.Dispose()
            } catch {
              Write-Host "ZIP_OPEN_FAILED=$($_.Exception.Message)"
            }
          }
      - name: Upload decoded probes
        uses: actions/upload-artifact@v4
        with:
          name: step095-source-probe
          path: probe
          retention-days: 1
