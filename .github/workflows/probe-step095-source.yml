name: TEMP STEP 09.5 Source Probe

on:
  push:
    branches:
      - 'sol/step09-5-tree-build-temp'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Diagnose preserved chunk format
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          alphabet = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          for source in ("zz_BOOTSTRAP", "zz_REBUILD"):
              print(f"SOURCE={source}")
              for path in sorted(Path(source, "chunks").glob("*.b64")):
                  raw = path.read_text(encoding="utf-8-sig")
                  stripped = raw.strip()
                  invalid = [(i, repr(ch), ord(ch)) for i, ch in enumerate(stripped) if ch not in alphabet]
                  eq = [i for i, ch in enumerate(stripped) if ch == "="]
                  print(
                      f"PART={path.name} RAW={len(raw)} STRIPPED={len(stripped)} MOD4={len(stripped)%4} "
                      f"INVALID={len(invalid)} EQCOUNT={len(eq)} FIRSTEQ={eq[:5]} LASTEQ={eq[-5:]} "
                      f"PREFIX={stripped[:32]!r} SUFFIX={stripped[-64:]!r}"
                  )
                  if invalid:
                      print(f"INVALID_SAMPLE={invalid[:12]}")
          '@ | Set-Content -Encoding utf8 probe_chunks.py
          python probe_chunks.py
