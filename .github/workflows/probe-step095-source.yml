name: TEMP STEP 09.5 Source Probe

on:
  push:
    branches:
      - 'sol/step09-5-tree-build-temp'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose preserved chunk format
        shell: pwsh
        run: |
          $alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          foreach ($source in @('zz_BOOTSTRAP','zz_REBUILD')) {
            Write-Host "SOURCE=$source"
            foreach ($part in (Get-ChildItem "$source/chunks/*.b64" | Sort-Object Name)) {
              $raw = Get-Content $part.FullName -Raw
              $text = $raw.Trim()
              if ($text.Length -gt 0 -and [int][char]$text[0] -eq 65279) { $text = $text.Substring(1) }
              $invalid = New-Object System.Collections.Generic.List[string]
              for ($i=0; $i -lt $text.Length; $i++) {
                $ch = $text[$i]
                if ($alphabet.IndexOf($ch) -lt 0) {
                  if ($invalid.Count -lt 12) { $invalid.Add("${i}:$([int][char]$ch)") }
                }
              }
              $eq = @()
              for ($i=0; $i -lt $text.Length; $i++) { if ($text[$i] -eq '=') { $eq += $i } }
              $prefix = $text.Substring(0, [Math]::Min(32,$text.Length))
              $suffixStart = [Math]::Max(0,$text.Length-64)
              $suffix = $text.Substring($suffixStart)
              $firstEq = ($eq | Select-Object -First 5) -join ','
              $lastEq = ($eq | Select-Object -Last 5) -join ','
              Write-Host "PART=$($part.Name) RAW=$($raw.Length) LEN=$($text.Length) MOD4=$($text.Length%4) INVALID_SAMPLE=$($invalid -join ',') EQCOUNT=$($eq.Count) FIRSTEQ=$firstEq LASTEQ=$lastEq PREFIX=$prefix SUFFIX=$suffix"
            }
          }
