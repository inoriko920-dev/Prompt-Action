name: STEP 11 Entry Gate CI

on:
  push:
    branches:
      - 'sol/step11-gate-verifier-*'
  pull_request:
    paths:
      - 'scripts/dev/verify_step11_entry_gate.py'
      - 'tests/step11_gate/**'
      - 'docs/implementation/STEP_11_SOL_EXECUTION_REPORT.md'
      - '.github/workflows/ci-step11-gate.yml'

jobs:
  validate-step11-entry-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Verify exact Python
        run: python -c "import platform,sys; assert sys.version_info[:3] == (3,13,16); assert platform.architecture()[0] == '64bit'"
      - name: Install exact lock
        run: python -m pip install -r requirements-lock.txt
      - name: Install Prompt Action editable
        run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Capture production hashes before gate check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-step11-gate-evidence | Out-Null
          python -c "import hashlib,json,pathlib; root=pathlib.Path('.'); files=[root/'data/version_history.json',*sorted((root/'prompts').rglob('*')), *sorted((root/'backups').rglob('*'))]; files=[p for p in files if p.is_file()]; out={str(p).replace('\\','/'):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}; pathlib.Path('ci-step11-gate-evidence/before.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n',encoding='utf-8')"
      - name: Observe live STEP 11 gate
        shell: pwsh
        run: |
          python scripts/dev/verify_step11_entry_gate.py | Tee-Object -FilePath ci-step11-gate-evidence/gate.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,pathlib; p=json.loads(pathlib.Path('ci-step11-gate-evidence/gate.json').read_text()); assert p['status']=='BLOCKED',p; assert 'SNAPSHOT_NOT_BACKUP_REQUIRED' in p['reasons'],p; assert p['active_snapshot']=='S001' and p['snapshot_status']=='COMPLETE',p"
      - name: Gate verifier tests
        run: python -m pytest tests/step11_gate -q
      - name: Prove gate verifier is read-only
        shell: pwsh
        run: |
          python -c "import hashlib,json,pathlib; root=pathlib.Path('.'); expected=json.loads(pathlib.Path('ci-step11-gate-evidence/before.json').read_text()); files=[root/'data/version_history.json',*sorted((root/'prompts').rglob('*')), *sorted((root/'backups').rglob('*'))]; files=[p for p in files if p.is_file()]; actual={str(p).replace('\\','/'):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}; assert actual==expected,(set(actual.items())^set(expected.items()))"
      - name: Upload STEP 11 gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step11-entry-gate-evidence
          path: ci-step11-gate-evidence
          retention-days: 30
