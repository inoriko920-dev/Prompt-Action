name: Materialize UI Reference Package

on:
  push:
    branches: [ main ]
    paths:
      - 'PLAN.md'
      - 'docs/VERSIONING_RULES.md'
      - 'docs/UI_REFERENCE_PACKAGE_V1/README.md'
      - 'docs/UI_REFERENCE_PACKAGE_V1/GPT_IMAGE_PROMPTS.md'
      - 'docs/UI_REFERENCE_PACKAGE_V1/images/**'
      - 'docs/UI_REFERENCE_PACKAGE_V1/sources/**'
      - '.github/workflows/materialize-ui-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode UI reference images
        shell: bash
        run: |
          set -euo pipefail
          SRC='docs/UI_REFERENCE_PACKAGE_V1/images'
          SOURCES='docs/UI_REFERENCE_PACKAGE_V1/sources'
          OUT='docs/UI_REFERENCE_PACKAGE_V1/materialized/images'
          rm -rf 'docs/UI_REFERENCE_PACKAGE_V1/materialized'
          mkdir -p "$OUT"

          base64 -d "$SRC/01-Dashboard.jpg.b64" > "$OUT/01-Dashboard.jpg"
          base64 -d "$SRC/02-Sejarah-Sistem.jpg.b64" > "$OUT/02-Sejarah-Sistem.jpg"
          base64 -d "$SRC/03-Per-Prompt.jpg.b64" > "$OUT/03-Per-Prompt.jpg"
          base64 -d "$SRC/04-Backup-Recovery.jpg.b64" > "$OUT/04-Backup-Recovery.jpg"
          base64 -d "$SRC/05-Pengaturan.jpg.b64" > "$OUT/05-Pengaturan.jpg"

          echo 'Validating JPEG outputs...'
          for f in "$OUT"/*.jpg; do
            file "$f"
            file "$f" | grep -q 'JPEG image data'
          done

      - name: Add canonical planning documents
        shell: bash
        run: |
          set -euo pipefail
          OUT='docs/UI_REFERENCE_PACKAGE_V1/materialized'
          cp PLAN.md "$OUT/ASTRA_MASTER_PLAN.md"
          cp docs/VERSIONING_RULES.md "$OUT/VERSIONING_RULES.md"
          cp docs/UI_REFERENCE_PACKAGE_V1/GPT_IMAGE_PROMPTS.md "$OUT/GPT_IMAGE_PROMPTS.md"
          cp docs/UI_REFERENCE_PACKAGE_V1/README.md "$OUT/README.md"

      - name: Generate canonical DOCX documents
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet python-docx
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Inches, Pt, RGBColor
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.section import WD_SECTION
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn

          repo = Path('.')
          out = repo / 'docs/UI_REFERENCE_PACKAGE_V1/materialized'
          out.mkdir(parents=True, exist_ok=True)

          def setup_doc(title, subtitle=None):
              doc = Document()
              sec = doc.sections[0]
              sec.top_margin = Inches(0.7)
              sec.bottom_margin = Inches(0.7)
              sec.left_margin = Inches(0.75)
              sec.right_margin = Inches(0.75)
              styles = doc.styles
              styles['Normal'].font.name = 'Aptos'
              styles['Normal'].font.size = Pt(10.5)
              p = doc.add_paragraph()
              p.alignment = WD_ALIGN_PARAGRAPH.CENTER
              r = p.add_run(title)
              r.bold = True
              r.font.size = Pt(24)
              r.font.color.rgb = RGBColor(13,58,125)
              if subtitle:
                  p = doc.add_paragraph()
                  p.alignment = WD_ALIGN_PARAGRAPH.CENTER
                  r = p.add_run(subtitle)
                  r.bold = True
                  r.font.size = Pt(13)
                  r.font.color.rgb = RGBColor(44,104,190)
              return doc

          def add_md(doc, text):
              in_code = False
              code_lines = []
              for raw in text.splitlines():
                  line = raw.rstrip()
                  if line.startswith('```'):
                      if in_code:
                          p = doc.add_paragraph()
                          r = p.add_run('\n'.join(code_lines))
                          r.font.name = 'Consolas'
                          r.font.size = Pt(9)
                          code_lines=[]
                          in_code=False
                      else:
                          in_code=True
                      continue
                  if in_code:
                      code_lines.append(line)
                      continue
                  if not line.strip():
                      continue
                  if line.startswith('### '):
                      doc.add_heading(line[4:], level=3)
                  elif line.startswith('## '):
                      doc.add_heading(line[3:], level=2)
                  elif line.startswith('# '):
                      doc.add_heading(line[2:], level=1)
                  elif line.startswith('- '):
                      doc.add_paragraph(line[2:], style='List Bullet')
                  elif line.startswith('> '):
                      p = doc.add_paragraph()
                      r=p.add_run(line[2:])
                      r.bold=True
                      r.font.color.rgb=RGBColor(22,78,150)
                  elif len(line) > 2 and line[0].isdigit() and '. ' in line[:5]:
                      doc.add_paragraph(line.split('. ',1)[1], style='List Number')
                  else:
                      doc.add_paragraph(line.replace('**','').replace('`',''))

          # 1) Versioning DOCX
          versioning = setup_doc(
              'PROMPT ACTION',
              'Aturan Resmi Versioning, Continuity, Backup & Handoff — System V1'
          )
          add_md(versioning, (repo/'docs/VERSIONING_RULES.md').read_text(encoding='utf-8'))
          versioning.save(out/'Aturan-Resmi-Versioning-Prompt-Action-V1.docx')

          # 2) Full UI specification DOCX
          ui = setup_doc(
              'PROMPT ACTION',
              'Spesifikasi Lengkap UI, Versioning & Recovery — MASTER UI V1'
          )
          p=ui.add_paragraph()
          p.alignment=WD_ALIGN_PARAGRAPH.CENTER
          r=p.add_run('MASTER VISUAL: putih + biru • desktop Windows • professional • calm • comfortable')
          r.bold=True
          r.font.color.rgb=RGBColor(44,104,190)

          ui.add_heading('A. Astra Master Plan', level=1)
          add_md(ui, (repo/'PLAN.md').read_text(encoding='utf-8'))

          ui.add_page_break()
          ui.add_heading('B. Lima Master UI Reference', level=1)
          refs=[
              ('01 — Dashboard','01-Dashboard.jpg'),
              ('02 — Sejarah Sistem','02-Sejarah-Sistem.jpg'),
              ('03 — Per Prompt','03-Per-Prompt.jpg'),
              ('04 — Backup & Recovery','04-Backup-Recovery.jpg'),
              ('05 — Pengaturan','05-Pengaturan.jpg'),
          ]
          for title,fn in refs:
              ui.add_heading(title, level=2)
              ui.add_picture(str(out/'images'/fn), width=Inches(6.8))
              ui.paragraphs[-1].alignment=WD_ALIGN_PARAGRAPH.CENTER

          ui.add_page_break()
          ui.add_heading('C. Aturan Versioning Resmi', level=1)
          add_md(ui, (repo/'docs/VERSIONING_RULES.md').read_text(encoding='utf-8'))

          ui.add_page_break()
          ui.add_heading('D. Lima Prompt GPT Image + Master Design Lock', level=1)
          add_md(ui, (repo/'docs/UI_REFERENCE_PACKAGE_V1/GPT_IMAGE_PROMPTS.md').read_text(encoding='utf-8'))

          ui.save(out/'Spesifikasi-Lengkap-UI-Versioning-Prompt-Action-V1.docx')

          print('Generated DOCX:')
          for p in sorted(out.glob('*.docx')):
              print(p, p.stat().st_size)
          PY

      - name: Validate generated DOCX
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('docs/UI_REFERENCE_PACKAGE_V1/materialized')
          docs=list(root.glob('*.docx'))
          assert len(docs) == 2, docs
          for p in docs:
              assert zipfile.is_zipfile(p), f'Invalid DOCX container: {p}'
              with zipfile.ZipFile(p) as z:
                  assert 'word/document.xml' in z.namelist(), p
              print('VALID DOCX', p, p.stat().st_size)
          PY

      - name: Build downloadable materialized ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          root = Path('docs/UI_REFERENCE_PACKAGE_V1/materialized')
          zip_path = Path('docs/UI_REFERENCE_PACKAGE_V1/Prompt-Action-UI-Reference-Materialized-V1.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(root))
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          Path(str(zip_path) + '.sha256').write_text(
              digest + '  ' + zip_path.name + '\n', encoding='utf-8'
          )
          print('SHA256:', digest)
          PY

      - name: Commit materialized reference package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/UI_REFERENCE_PACKAGE_V1/materialized \
                  docs/UI_REFERENCE_PACKAGE_V1/Prompt-Action-UI-Reference-Materialized-V1.zip \
                  docs/UI_REFERENCE_PACKAGE_V1/Prompt-Action-UI-Reference-Materialized-V1.zip.sha256
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Materialize Prompt Action UI reference assets and DOCX'
          git pull --rebase origin main
          git push origin main
