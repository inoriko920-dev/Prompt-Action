name: Materialize UI Reference Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode UI reference images
        shell: bash
        run: |
          set -euo pipefail
          SRC="docs/UI_REFERENCE_PACKAGE_V1/images"
          OUT="docs/UI_REFERENCE_PACKAGE_V1/materialized/images"
          mkdir -p "$OUT"

          base64 -d "$SRC/01-Dashboard.jpg.b64" > "$OUT/01-Dashboard.jpg"
          base64 -d "$SRC/02-Sejarah-Sistem.jpg.b64" > "$OUT/02-Sejarah-Sistem.jpg"
          cat "$SRC/03-Per-Prompt"/part-*.b64 | base64 -d > "$OUT/03-Per-Prompt.jpg"
          base64 -d "$SRC/04-Backup-Recovery.jpg.b64" > "$OUT/04-Backup-Recovery.jpg"
          base64 -d "$SRC/05-Pengaturan.jpg.b64" > "$OUT/05-Pengaturan.jpg"

          file "$OUT"/*.jpg

      - name: Build materialized reference ZIP
        shell: bash
        run: |
          set -euo pipefail
          OUT="docs/UI_REFERENCE_PACKAGE_V1/materialized"
          cp PLAN.md "$OUT/ASTRA_MASTER_PLAN.md"
          cp docs/UI_REFERENCE_PACKAGE_V1/GPT_IMAGE_PROMPTS.md "$OUT/GPT_IMAGE_PROMPTS.md"
          cp docs/UI_REFERENCE_PACKAGE_V1/README.md "$OUT/README.md"
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          root = Path('docs/UI_REFERENCE_PACKAGE_V1/materialized')
          zip_path = Path('docs/UI_REFERENCE_PACKAGE_V1/Prompt-Action-UI-Reference-Materialized-V1.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(root))
          h = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          Path(str(zip_path) + '.sha256').write_text(h + '  ' + zip_path.name + '\n', encoding='utf-8')
          print(h)
          PY

      - name: Commit generated reference files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UI_REFERENCE_PACKAGE_V1/materialized \
                  docs/UI_REFERENCE_PACKAGE_V1/Prompt-Action-UI-Reference-Materialized-V1.zip \
                  docs/UI_REFERENCE_PACKAGE_V1/Prompt-Action-UI-Reference-Materialized-V1.zip.sha256
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Materialize Prompt Action UI reference assets"
          git push
