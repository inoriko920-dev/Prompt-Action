name: STEP 09.5 One-time Materializer

on:
  push:
    branches: ['sol/step09-5-baseline-bootstrap-20261003']

permissions:
  contents: write

concurrency:
  group: step095-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ contains(github.event.head_commit.message, '[run-step095-materializer]') && !contains(github.event.head_commit.message, '[step095-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Expand exact Prompt capsule and build bootstrap ZIP
        run: python scripts/dev/rebuild_step095_bootstrap_from_preserved_chunks.py
      - name: Materialize exact Prompt bytes and canonical state
        run: python scripts/dev/materialize_step095_prompts.py
      - name: Commit atomic materialization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/version_history.json prompts backups docs/evidence/step095
          git rm -r --ignore-unmatch docs/evidence/step095/exact_prompt_capsule
          if git diff --cached --quiet; then
            echo 'Nothing to materialize.'
            exit 0
          fi
          git commit -m 'STEP 09.5: materialize exact baseline + complete S001 [step095-materialized]'
          git push origin HEAD:${GITHUB_REF_NAME}
